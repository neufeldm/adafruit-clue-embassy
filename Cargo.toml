[package]
authors = ["Michael Neufeld <mj9eld@gmail.com>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "Embassy basic board support for Adafruit Clue"
license = "MIT"
keywords = ["arm", "cortex-m", "nrf52", "hal"]
name = "adafruit-clue-embassy"
version = "0.0.1"
edition = "2021"

[dependencies]
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time", "nfc-pins-as-gpio"] }
nrf-softdevice = { version = "0.1.0", features = [
    "nrf52840",
    "s140",
    "ble-peripheral",
    "ble-central",
    "ble-gatt-server",
    "critical-section-impl",
] }

[dev-dependencies]
embassy-sync = { version = "0.8.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"]}
embassy-time = { version = "0.5.1" }
futures = { version = "0.3.34", default-features = false }
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-embedded-hal = { version = "0.6.0" }
portable-atomic = "1.15"
embedded-hal-bus = "0.3.0"
heapless = "0.9.3"

# screen
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.2"
mipidsi = "0.10.0"

# gyro/accel
lsm6ds33 = "0.5.0"
# magnetometer
lis3mdl = { git = "https://github.com/ryanrightmer/lis3mdl" }
# prox/gesture/light
apds9960 = "0.1.0"
# humidity
sht3x = { git = "https://github.com/reitermarkus/sht3x-rs" }
# temp/pressure
bmp280-rs = "0.1.2"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
